[package]
name = "srec"
version = "1.0.0-alpha.1"
authors = ["The SRec Authors"]
edition = "2021"
description = "Compact AV1 screen recorder for Windows with a Dynamic-Island style floating UI"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ljworld/SRec"
keywords = ["screen-recorder", "av1", "whisper", "subtitles", "windows"]
categories = ["multimedia::video"]
publish = false

[[bin]]
name = "srec"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.29.1", default-features = false, features = ["default_fonts", "glow"] }
cpal = "=0.18.2"
windows-core = "=0.58.0"
windows = { version = "=0.58.0", features = [
    "implement",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
